apiVersion: apps/v1
kind: Deployment
metadata:
  name: camera
  labels:
    app: camera
    tier: iot
spec:
  replicas: 2
  selector:
    matchLabels:
      app: camera
  template:
    metadata:
      labels:
        app: camera
        tier: iot
    spec:
      nodeSelector:
        testbed-role: IoT
      containers:
        - name: camera
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: camera
  labels:
    app: camera
spec:
  selector:
    app: camera
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
---
