apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: camera-to-transcoder-delay
spec:
  action: delay
  mode: all
  selector:
    namespaces:
      - default
    labelSelectors:
      app: camera
  direction: to
  target:
    mode: all
    selector:
      namespaces:
        - default
      labelSelectors:
        app: transcoder
  delay:
    latency: "10ms"
    jitter: "2ms"
    correlation: "0"
---
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: camera-to-transcoder-bandwidth
spec:
  action: bandwidth
  mode: all
  selector:
    namespaces:
      - default
    labelSelectors:
      app: camera
  direction: to
  target:
    mode: all
    selector:
      namespaces:
        - default
      labelSelectors:
        app: transcoder
  bandwidth:
    rate: "200mbit"
    buffer: 10000
    limit: 10000
---
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: camera-to-transcoder-loss
spec:
  action: loss
  mode: all
  selector:
    namespaces:
      - default
    labelSelectors:
      app: camera
  direction: to
  target:
    mode: all
    selector:
      namespaces:
        - default
      labelSelectors:
        app: transcoder
  loss:
    loss: "0.1"
    correlation: "0"
---
