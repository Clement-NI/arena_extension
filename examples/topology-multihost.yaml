# Arena MULTI-HOST topology.
# --------------------------------------------------------------------
# Designed to pair with examples/nodes-multihost.json, where each tier
# lives on its OWN physical host:
#
#   host "default"     (manager) : Controller + Cloud
#   host "edge-host-1"           : Edge-1, Edge-2
#   host "iot-host-1"            : IoT-1, IoT-2, IoT-3
#
# Regions are deliberately aligned 1:1 with physical hosts, so that:
#   intra-region  == intra-host  (traffic stays on one machine)
#   inter-region  == inter-host  (traffic crosses the Swarm overlay /
#                                 VXLAN between physical machines)
#
# That alignment is what makes the multi-host verification meaningful:
# every inter-region rule below is also a CROSS-MACHINE link, so when we
# confirm the shaped latency/bandwidth/loss we are proving chaos-daemon
# shapes the pod veth even as packets egress the host over the overlay.
#
# The Controller (control-plane) is intentionally absent — the compiler
# only walks worker nodes, so we never shape K8s control traffic.
# --------------------------------------------------------------------

version: "1"

regions:
  iot:
    members: [IoT-1, IoT-2, IoT-3]   # all on iot-host-1
  edge:
    members: [Edge-1, Edge-2]        # all on edge-host-1
  cloud:
    members: [Cloud]                 # on the manager host

defaults:
  intra-region:                  # intra-HOST: fast LAN, no overlay hop
    latency:   "1ms"
    jitter:    "0.5ms"
    bw:        "10Gbit"
    loss:      "0"
  inter-region:                  # inter-HOST: crosses the Swarm overlay
    latency:   "20ms"
    jitter:    "2ms"
    bw:        "200Mbit"
    loss:      "0.2"
    duplicate: "0.1"
    corrupt:   "0.05"

# Region pairs == host pairs. Each is a cross-machine link.
region_pairs:
  - { from: iot,  to: edge,  latency: "10ms", bw: "500Mbit" }   # IoT host → Edge host (near)
  - { from: iot,  to: cloud, latency: "40ms", bw: "100Mbit" }   # IoT host → Cloud host (far)
  - { from: edge, to: cloud, latency: "20ms", bw: "1Gbit"   }   # Edge host → Cloud host

# Per-node-pair override — a single "satellite" IoT node on the far link.
exceptions:
  - from: IoT-3
    to:   Cloud
    latency:   "300ms"
    jitter:    "50ms"
    bw:        "5Mbit"
    loss:      "2"
    comment: "satellite uplink (worst-case cross-host link)"

symmetric: true
