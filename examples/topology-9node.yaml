# Arena 9-node topology
# ─────────────────────────────────────────────────────────────────
# Architecture : 3-tier full-mesh IoT-Edge-Cloud
#   IoT-1, IoT-2, IoT-3       (sensors, low-resource)
#   Edge-1, Edge-2, Edge-3    (edge gateways, mid-resource)
#   Cloud-1, Cloud-2, Cloud-3 (cloud servers, high-resource)
#
# Connectivity matrix :
#   IoT  ↔ IoT     : direct (intra-region, fast LAN)
#   IoT  ↔ Edge    : 5G urban (mid-latency, mid-bw)
#   Edge ↔ Edge    : direct (intra-region, fast LAN)
#   Edge ↔ Cloud   : fiber (low-latency, high-bw)
#   Cloud↔ Cloud   : direct (intra-region, fast LAN)
#   IoT  ↔ Cloud   : no direct path (uses inter-region default = degraded)
# ─────────────────────────────────────────────────────────────────

version: "1"

regions:
  iot:   { members: [IoT-1, IoT-2, IoT-3] }
  edge:  { members: [Edge-1, Edge-2, Edge-3] }
  cloud: { members: [Cloud-1, Cloud-2, Cloud-3] }

defaults:
  intra-region:
    latency: 1ms
    bw: 1Gbit
    loss: "0"
  inter-region:
    # Default = unreachable-ish path (used for IoT↔Cloud).
    # Showcases what happens when no direct route exists.
    latency: 300ms
    bw: 1Mbit
    loss: "10"

region_pairs:
  # IoT  ↔ Edge : 5G urban
  - { from: iot,  to: edge,  latency: 15ms, bw: 200Mbit, loss: "0.5" }
  - { from: edge, to: iot,   latency: 15ms, bw: 200Mbit, loss: "0.5" }

  # Edge ↔ Cloud : fiber datacenter
  - { from: edge,  to: cloud, latency: 5ms,  bw: 10Gbit, loss: "0" }
  - { from: cloud, to: edge,  latency: 5ms,  bw: 10Gbit, loss: "0" }

# Per-node fine-tuning
exceptions:
  # IoT-1 and Edge-1 are in the same building (rare best-case link)
  - { from: IoT-1, to: Edge-1, latency: 1ms, bw: 1Gbit, loss: "0" }
  - { from: Edge-1, to: IoT-1, latency: 1ms, bw: 1Gbit, loss: "0" }

  # Cloud-1 ↔ Cloud-2 is an HA pair (lowest latency)
  - { from: Cloud-1, to: Cloud-2, latency: 0.2ms, bw: 10Gbit, loss: "0" }
  - { from: Cloud-2, to: Cloud-1, latency: 0.2ms, bw: 10Gbit, loss: "0" }

symmetric: false   # we set both directions explicitly above
