# Arena 9-node topology (hierarchical, ≤7 rules per pod)
# ─────────────────────────────────────────────────────────────────
# Chaos Mesh's chaos-daemon caps at ~7 netem rules per pod's egress.
# Beyond that, the tc tree build fails with "Specified class not
# found" (off-by-one in the daemon's prio qdisc allocation).
#
# Realistic computing-continuum traffic is HIERARCHICAL :
#   IoT  ↔ IoT      (intra-region peer discovery)
#   IoT  ↔ Edge     (sensor → gateway uplink)
#   Edge ↔ Edge     (gateway peer)
#   Edge ↔ Cloud    (gateway → backend)
#   Cloud↔ Cloud    (backend HA / peer)
#
# Notably : IoT ↔ Cloud is NOT a direct path — traffic goes via Edge.
# This is both realistic AND keeps each pod ≤ 7 outgoing rules.
# ─────────────────────────────────────────────────────────────────

version: "1"

regions:
  iot:   { members: [IoT-1, IoT-2, IoT-3] }
  edge:  { members: [Edge-1, Edge-2, Edge-3] }
  cloud: { members: [Cloud-1, Cloud-2, Cloud-3] }

defaults:
  intra-region:
    latency: 1ms
    bw: 1Gbit
    loss: "0"
  inter-region:
    # No direct path declared. Pairs not listed below inherit this.
    # We mark them as "partition-like" (extreme degradation).
    latency: 999ms
    bw: 100kbit
    loss: "30"

region_pairs:
  # IoT ↔ Edge : 5G urbain
  - { from: iot,  to: edge,  latency: 15ms, bw: 200Mbit, loss: "0.5" }
  - { from: edge, to: iot,   latency: 15ms, bw: 200Mbit, loss: "0.5" }

  # Edge ↔ Cloud : fibre datacenter
  - { from: edge,  to: cloud, latency: 5ms,  bw: 10Gbit, loss: "0" }
  - { from: cloud, to: edge,  latency: 5ms,  bw: 10Gbit, loss: "0" }

  # PAS de iot ↔ cloud direct → utilise les defaults inter-region "partition-like"

exceptions:
  # Same-building : IoT-1 et Edge-1 voisins
  - { from: IoT-1,  to: Edge-1, latency: 1ms, bw: 1Gbit, loss: "0" }
  - { from: Edge-1, to: IoT-1,  latency: 1ms, bw: 1Gbit, loss: "0" }

  # HA pair : Cloud-1 et Cloud-2
  - { from: Cloud-1, to: Cloud-2, latency: 0.2ms, bw: 10Gbit, loss: "0" }
  - { from: Cloud-2, to: Cloud-1, latency: 0.2ms, bw: 10Gbit, loss: "0" }

symmetric: false
